name: SonarCloud

on:
  push:
    branches:
      - main
      - lab
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarcloud:
    continue-on-error: true
    # Euryale depends on Apple-only frameworks (MapKit, WebKit, PDFKit,
    # MetalKit, TextKit, CoreLocation, Vision).  It does not compile under
    # swift-corelibs Foundation on Linux, so the scan runs on a macOS runner and
    # uses xcodebuild for the build + test + coverage pipeline.  The tests
    # themselves run on the **iOS Simulator**, not the macOS destination: the UI
    # snapshot suites are gated `#if os(iOS) && !targetEnvironment(macCatalyst)`,
    # so only an iOS run actually executes them and produces coverage for the
    # iOS-only UI code (EntityList, the photo galleries, the segmented control…).
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Check Swift Version
        run: swift --version

      - name: Test with code coverage
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme "Euryale" \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES \
            -derivedDataPath "$PWD/.derivedData"

      - name: Convert coverage to Sonar generic XML
        shell: bash
        run: |
          set -euo pipefail

          PROFDATA="$(find "$PWD/.derivedData" -type f -name 'Coverage.profdata' | head -n 1)"
          if [ -z "$PROFDATA" ]; then
            PROFDATA="$(find "$PWD/.derivedData" -type f -name '*.profdata' | head -n 1)"
          fi

          TEST_BUNDLE="$(find "$PWD/.derivedData" -type d -name '*.xctest' | head -n 1)"
          TEST_NAME="$(basename "$TEST_BUNDLE" .xctest)"
          # macOS bundles keep the binary under Contents/MacOS; iOS-simulator
          # .xctest bundles put it directly inside the bundle.  Support both.
          if [ -f "$TEST_BUNDLE/Contents/MacOS/$TEST_NAME" ]; then
            TEST_BIN="$TEST_BUNDLE/Contents/MacOS/$TEST_NAME"
          else
            TEST_BIN="$TEST_BUNDLE/$TEST_NAME"
          fi

          [ -n "${PROFDATA:-}" ] || { echo "profdata not found under .derivedData"; exit 1; }
          [ -f "${TEST_BIN:-}" ] || { echo "test binary not found at $TEST_BIN"; exit 1; }

          xcrun llvm-cov export \
            -format=lcov \
            -instr-profile "$PROFDATA" \
            "$TEST_BIN" > coverage.lcov

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          ws = os.path.abspath(os.environ.get("GITHUB_WORKSPACE", "."))
          files = defaultdict(dict)
          cur = None

          for raw in open("coverage.lcov", encoding="utf-8"):
              line = raw.strip()
              if line.startswith("SF:"):
                  p = os.path.abspath(line[3:])
                  cur = os.path.relpath(p, ws) if p.startswith(ws + os.sep) else None
              elif line.startswith("DA:") and cur:
                  ln, hits = line[3:].split(",")[:2]
                  ln = int(ln); hits = int(hits)
                  files[cur][ln] = max(files[cur].get(ln, 0), hits)

          root = ET.Element("coverage", version="1")
          for path in sorted(files):
              f = ET.SubElement(root, "file", path=path)
              for ln in sorted(files[path]):
                  ET.SubElement(f, "lineToCover", lineNumber=str(ln), covered=("true" if files[path][ln] > 0 else "false"))

          ET.ElementTree(root).write("coverage.xml", encoding="utf-8", xml_declaration=True)
          PY

      - name: Debug coverage.xml
        run: |
          grep -c "<file path=" coverage.xml || true
          head -n 40 coverage.xml || true

      - name: Install Sonar Scanner
        run: brew install sonar-scanner

      - name: SonarCloud Scan
        run: sonar-scanner -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
