sonar.organization=auvents-brave
sonar.projectKey=auvents-brave_Euryale
sonar.projectName=Euryale
sonar.sourceEncoding=UTF-8

sonar.sources=Sources
sonar.tests=Tests
sonar.test.inclusions=Tests/**
sonar.exclusions=**/.build/**,**/.swiftpm/**,**/DerivedData/**

# Coverage-only exclusions: files whose lines can't be exercised by the unit
# suite — either gated by `#if` blocks inactive on the test platform, or made of
# system side-effects / framework callbacks with no assertable behaviour.  They
# stay in `sonar.sources` and are still scanned for bugs / smells / security
# hotspots, but dropped from the coverage metric.
#   - Slider.swift              — entirely #if os(tvOS).
#   - TextKitView.swift         — #if !os(macOS) && !os(watchOS) (UIKit only).
#   - MapKitView.swift          — watchOS Map() branch unreachable on macOS.
#   - Platform.swift            — NSWorkspace / UIApplication side-effecting
#                                 system calls (openSystemURL,
#                                 openNotificationSettings); partly #if-gated,
#                                 no assertable behaviour in a unit test.
#   - MapDelegate.swift         — MapKit delegate callbacks, driven by the live
#                                 map view, not reachable in a unit test.
#   - MapKitView+Markers.swift  — MapKit annotation rendering, same as above.
sonar.coverage.exclusions=Sources/Euryale/UI/Slider.swift,Sources/Euryale/Kit/TextKitView.swift,Sources/Euryale/Kit/MKMapView with MKTileOverlay support/MapKitView.swift,Sources/Euryale/Platform.swift,Sources/Euryale/Kit/MKMapView with MKTileOverlay support/MapDelegate.swift,Sources/Euryale/Kit/MKMapView with MKTileOverlay support/MapKitView+Markers.swift

sonar.coverageReportPaths=coverage.xml
